name: family-ai-local
services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run npm run env:init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run env:init}
      POSTGRES_DB: ${POSTGRES_DB:?Run npm run env:init}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
