name: ${COMPOSE_PROJECT_NAME:-family-ai-staging}

x-app-defaults: &app-defaults
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: '1.00'
        memory: 1536M

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 3G

  api:
    <<: *app-defaults
    security_opt:
      - no-new-privileges:true
    image: ${IMAGE_REPOSITORY:-family-ai}/api:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      APP_ENV: staging
      NODE_ENV: production
      HOST: 0.0.0.0
      API_PORT: 4010
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN}
      API_INTERNAL_URL: http://api:4010
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?Set AUTH_DATABASE_URL}
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      MEDIA_STORAGE_ENDPOINT: ${MEDIA_STORAGE_ENDPOINT:?Set MEDIA_STORAGE_ENDPOINT}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-auto}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:?Set MEDIA_STORAGE_BUCKET}
      MEDIA_STORAGE_ACCESS_KEY_ID: ${MEDIA_STORAGE_ACCESS_KEY_ID:?Set MEDIA_STORAGE_ACCESS_KEY_ID}
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ${MEDIA_STORAGE_SECRET_ACCESS_KEY:?Set MEDIA_STORAGE_SECRET_ACCESS_KEY}
      MEDIA_STORAGE_FORCE_PATH_STYLE: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4010/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  worker:
    <<: *app-defaults
    security_opt:
      - no-new-privileges:true
    image: ${IMAGE_REPOSITORY:-family-ai}/worker:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    environment:
      NODE_ENV: production
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL}
      MEDIA_STORAGE_ENDPOINT: ${MEDIA_STORAGE_ENDPOINT:?Set MEDIA_STORAGE_ENDPOINT}
      MEDIA_STORAGE_REGION: ${MEDIA_STORAGE_REGION:-auto}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:?Set MEDIA_STORAGE_BUCKET}
      MEDIA_STORAGE_ACCESS_KEY_ID: ${MEDIA_STORAGE_ACCESS_KEY_ID:?Set MEDIA_STORAGE_ACCESS_KEY_ID}
      MEDIA_STORAGE_SECRET_ACCESS_KEY: ${MEDIA_STORAGE_SECRET_ACCESS_KEY:?Set MEDIA_STORAGE_SECRET_ACCESS_KEY}
      MEDIA_STORAGE_FORCE_PATH_STYLE: 'false'
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app-defaults
    security_opt:
      - no-new-privileges:true
    image: ${IMAGE_REPOSITORY:-family-ai}/web:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      PORT: 3200
      API_INTERNAL_URL: http://api:4010
    ports:
      - '127.0.0.1:3200:3200'
    depends_on:
      api:
        condition: service_healthy

  migrate:
    profiles: [tools]
    image: ${IMAGE_REPOSITORY:-family-ai}/tools:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: tools
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: staging
      ALLOW_STAGING_PROVISION: ${ALLOW_STAGING_PROVISION:-false}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      AUTH_DATABASE_URL: ${AUTH_DATABASE_URL:?Set AUTH_DATABASE_URL}
      RUNTIME_DATABASE_URL: ${RUNTIME_DATABASE_URL:?Set RUNTIME_DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL:?Set WORKER_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        node packages/database/scripts/migrate.mjs &&
        node packages/database/scripts/migrate.mjs &&
        node packages/database/scripts/provision-auth.mjs &&
        node packages/database/scripts/status.mjs

  backup:
    profiles: [backup]
    image: ${IMAGE_REPOSITORY:-family-ai}/backup:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /work:uid=70,gid=70,mode=0700
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?Set BACKUP_R2_ENDPOINT}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?Set BACKUP_R2_BUCKET}
      AWS_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?Set BACKUP_R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?Set BACKUP_R2_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: auto
    depends_on:
      postgres:
        condition: service_healthy

  restore-drill:
    profiles: [restore-drill]
    image: ${IMAGE_REPOSITORY:-family-ai}/backup:${IMAGE_TAG:?Set IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    entrypoint: [restore-postgres]
    restart: 'no'
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /work:uid=70,gid=70,mode=0700
    volumes:
      - ${AGE_IDENTITY_PATH:?Set AGE_IDENTITY_PATH}:/run/secrets/age-key.txt:ro
    environment:
      APP_ENV: staging
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RESTORE_DATABASE: ${RESTORE_DATABASE:?Set RESTORE_DATABASE}
      BACKUP_OBJECT_KEY: ${BACKUP_OBJECT_KEY:?Set BACKUP_OBJECT_KEY}
      BACKUP_R2_ENDPOINT: ${BACKUP_R2_ENDPOINT:?Set BACKUP_R2_ENDPOINT}
      BACKUP_R2_BUCKET: ${BACKUP_R2_BUCKET:?Set BACKUP_R2_BUCKET}
      AWS_ACCESS_KEY_ID: ${BACKUP_R2_ACCESS_KEY_ID:?Set BACKUP_R2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_R2_SECRET_ACCESS_KEY:?Set BACKUP_R2_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: auto
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
