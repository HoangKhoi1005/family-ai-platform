name: Monorepo CI
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: family_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: family_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U family_test -d family_test" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.30.4
        ports: ['1025:1025', '8025:8025']
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      APP_ENV: local
      DATABASE_URL: postgresql://family_test:ephemeral_ci_only@127.0.0.1:5432/family_test
      AUTH_DATABASE_URL: postgresql://family_auth:ephemeral_auth_only@127.0.0.1:5432/family_test
      RUNTIME_DATABASE_URL: postgresql://family_runtime:ephemeral_runtime_only@127.0.0.1:5432/family_test
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-012345678901234567890123
      WEB_ORIGIN: http://127.0.0.1:3200
      API_INTERNAL_URL: http://127.0.0.1:4010
      API_PORT: '4010'
      PORT: '3200'
      HOST: 127.0.0.1
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: '1025'
      MAILPIT_PORT: '8025'
      MAIL_FROM: no-reply@family-ai.local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare auth test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=local
          DATABASE_URL=postgresql://family_test:ephemeral_ci_only@127.0.0.1:5432/family_test
          AUTH_DATABASE_URL=postgresql://family_auth:ephemeral_auth_only@127.0.0.1:5432/family_test
          RUNTIME_DATABASE_URL=postgresql://family_runtime:ephemeral_runtime_only@127.0.0.1:5432/family_test
          BETTER_AUTH_SECRET=ci-only-better-auth-secret-012345678901234567890123
          WEB_ORIGIN=http://127.0.0.1:3200
          API_INTERNAL_URL=http://127.0.0.1:4010
          API_PORT=4010
          PORT=3200
          HOST=127.0.0.1
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          MAIL_FROM=no-reply@family-ai.local
          EOF
      - run: npm run check
      - run: node packages/database/scripts/migrate.mjs
      - run: node packages/database/scripts/migrate.mjs
      - run: node packages/database/scripts/provision-auth.mjs
      - run: node packages/database/scripts/test.mjs
      - run: node packages/database/scripts/test-auth-schema.mjs
      - run: npm run test:auth
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify connected onboarding in a real browser
        timeout-minutes: 8
        shell: bash
        run: |
          node --env-file=.env apps/api/dist/server.js > api-onboarding.log 2>&1 &
          api_pid=$!
          node node_modules/next/dist/bin/next start apps/web --hostname 127.0.0.1 --port 3200 > web-onboarding.log 2>&1 &
          web_pid=$!

          cleanup() {
            kill "$web_pid" "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..40}; do
            if ! kill -0 "$api_pid" 2>/dev/null || ! kill -0 "$web_pid" 2>/dev/null; then
              echo "A connected onboarding service exited before readiness."
              tail -n 100 api-onboarding.log web-onboarding.log
              exit 1
            fi
            if curl --fail --silent http://127.0.0.1:4010/health/live > /dev/null \
              && curl --fail --silent http://127.0.0.1:3200/login > /dev/null \
              && curl --fail --silent 'http://127.0.0.1:8025/api/v1/messages?limit=1' > /dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done

          if [ "$ready" -ne 1 ]; then
            echo "Connected onboarding services did not become ready."
            tail -n 100 api-onboarding.log web-onboarding.log
            exit 1
          fi

          node --env-file=.env scripts/verify-connected-onboarding.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure
          path: |
            test-results/
            .superpowers/ui-preview-evidence/flow-failure-*.png
          retention-days: 7
