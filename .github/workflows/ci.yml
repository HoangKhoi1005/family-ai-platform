name: Monorepo CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: family_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: family_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U family_test -d family_test" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://family_test:ephemeral_ci_only@127.0.0.1:5432/family_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: node packages/database/scripts/migrate.mjs
      - run: node packages/database/scripts/migrate.mjs
      - run: node packages/database/scripts/test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
